<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Tea Stopwatch">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">

<title>Tea Stopwatch</title>

<style>
  :root { color-scheme: dark; }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                 "Helvetica Neue", Arial, sans-serif;
    user-select: none;
    -webkit-user-select: none;
    overscroll-behavior: none;
  }

  #app {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #000;
    padding:
      env(safe-area-inset-top)
      env(safe-area-inset-right)
      env(safe-area-inset-bottom)
      env(safe-area-inset-left);
  }

  #time {
    color: #fff;
    font-weight: 200;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    white-space: nowrap;
    letter-spacing: -0.045em;
    text-align: center;
  }

  #control {
    border: 0;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
    outline: none;
  }

  #control.running {
    background: #303030;
    color: #fff;
  }

  #control.stopped {
    background: #0b2c13;
    color: #51d96b;
  }

  #control:active {
    transform: scale(0.96);
  }

  /* Portrait */
  @media (orientation: portrait) {
    #app {
      justify-content: flex-start;
      padding-top: calc(env(safe-area-inset-top) + 23vh);
    }

    #time {
      font-size: min(23vw, 20vh);
    }

    #control {
      width: 150px;
      height: 150px;
      margin-top: 22vh;
      font-size: 32px;
    }
  }

  /* Landscape */
  @media (orientation: landscape) {
    #app {
      justify-content: center;
      flex-direction: row;
      gap: 8vw;
    }

    #time {
      font-size: min(18vw, 46vh);
    }

    #control {
      width: 125px;
      height: 125px;
      font-size: 27px;
      flex: 0 0 auto;
    }
  }

  #status {
    position: fixed;
    left: 0;
    right: 0;
    bottom: max(7px, env(safe-area-inset-bottom));
    text-align: center;
    font-size: 10px;
    opacity: 0.16;
    pointer-events: none;
  }
</style>
</head>

<body>
<div id="app">
  <div id="time">00:00.0</div>
  <button id="control" class="stopped" aria-label="開始或重置">開始</button>
  <div id="status"></div>
</div>

<script>
(() => {
  const timeEl = document.getElementById('time');
  const control = document.getElementById('control');
  const statusEl = document.getElementById('status');

  let running = false;
  let startedAt = 0;
  let stoppedElapsed = 0;
  let wakeLock = null;

  let pressTimer = null;
  let longPressed = false;

  function elapsedMs() {
    return running ? performance.now() - startedAt : stoppedElapsed;
  }

  function formatTime(ms) {
    const tenthsTotal = Math.floor(ms / 100);
    const tenth = tenthsTotal % 10;
    const secondsTotal = Math.floor(tenthsTotal / 10);
    const sec = secondsTotal % 60;
    const min = Math.floor(secondsTotal / 60);

    return `${String(min).padStart(2,'0')}:${String(sec).padStart(2,'0')}.${tenth}`;
  }

  function draw() {
    timeEl.textContent = formatTime(elapsedMs());
    requestAnimationFrame(draw);
  }

  function updateButton() {
    if (running) {
      control.textContent = '重置';
      control.className = 'running';
    } else {
      control.textContent = '開始';
      control.className = 'stopped';
    }
  }

  async function requestWakeLock() {
    if (!running) return;

    if (!('wakeLock' in navigator)) {
      statusEl.textContent = '螢幕常亮功能未支援';
      return;
    }

    try {
      wakeLock = await navigator.wakeLock.request('screen');
      statusEl.textContent = '';

      wakeLock.addEventListener('release', () => {
        wakeLock = null;
      });
    } catch (_) {
      statusEl.textContent = '螢幕常亮暫時無法啟用';
    }
  }

  async function startFresh() {
    stoppedElapsed = 0;
    startedAt = performance.now();
    running = true;
    updateButton();
    await requestWakeLock();
  }

  async function stopTimer() {
    if (!running) return;

    stoppedElapsed = performance.now() - startedAt;
    running = false;
    updateButton();

    if (wakeLock) {
      try { await wakeLock.release(); } catch (_) {}
      wakeLock = null;
    }
  }

  // Short tap:
  // stopped = start
  // running = reset + immediately restart
  control.addEventListener('click', async (e) => {
    e.preventDefault();
    if (!longPressed) {
      await startFresh();
    }
  });

  // Long press = stop / resume
  control.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    longPressed = false;
    clearTimeout(pressTimer);

    pressTimer = setTimeout(async () => {
      longPressed = true;

      if (running) {
        await stopTimer();
      } else {
        await startFresh();
      }
    }, 850);
  }, { passive: false });

  control.addEventListener('pointerup', (e) => {
    clearTimeout(pressTimer);

    if (longPressed) {
      e.preventDefault();
      e.stopPropagation();
      setTimeout(() => { longPressed = false; }, 50);
    }
  });

  control.addEventListener('pointercancel', () => {
    clearTimeout(pressTimer);
  });

  control.addEventListener('contextmenu', (e) => e.preventDefault());

  // iOS may release Wake Lock when the app leaves foreground.
  // Re-request when visible again.
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState === 'visible' && running && !wakeLock) {
      await requestWakeLock();
    }
  });

  window.addEventListener('pageshow', async () => {
    if (running && !wakeLock) {
      await requestWakeLock();
    }
  });

  // Register service worker for offline use.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }

  updateButton();
  draw();
})();
</script>
</body>
</html>
