<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Tea Stopwatch">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Tea Stopwatch V1.6</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
#app{position:fixed;inset:0;width:100vw;height:100dvh;background:#000;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);transition:background .08s,color .08s}
#app.flash{background:#fff;color:#000}
#time{font-weight:200;font-variant-numeric:tabular-nums;letter-spacing:-.045em;line-height:1;white-space:nowrap;text-align:center}
.controls{display:flex;align-items:center;justify-content:center;gap:28px}
.circle{border:0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:inherit;font-weight:600;touch-action:manipulation}
.circle:active{transform:scale(.96)}
#reset{background:#303030;color:#fff}
#stop{background:#3b1010;color:#ff5a5f}
#stop.start{background:#0b2c13;color:#51d96b}
#gear{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));border:0;background:transparent;color:#777;font-size:52px;padding:12px;opacity:.65;line-height:1}
#panel{position:fixed;inset:0;background:rgba(0,0,0,.94);display:none;align-items:center;justify-content:center;padding:18px;overflow:auto}
#panel.show{display:flex}
.card{width:min(460px,94vw);background:#151515;border:1px solid #333;border-radius:24px;padding:22px;max-height:92dvh;overflow:auto}
.card h2{margin:0 0 16px;font-size:22px}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid #2d2d2d}
.row:last-of-type{border-bottom:0}
label{font-size:17px}
input[type=number],select{font:inherit;background:#242424;color:#fff;border:1px solid #444;border-radius:10px;padding:8px 10px;min-width:110px}
input[type=checkbox]{width:24px;height:24px}
.volWrap{display:flex;align-items:center;gap:10px;min-width:180px}
input[type=range]{width:130px}
#volumeValue{min-width:46px;text-align:right;font-variant-numeric:tabular-nums}
.actions{display:flex;gap:12px;margin-top:18px}
.actions button{flex:1;border:0;border-radius:12px;padding:13px 16px;font:inherit;font-weight:600}
#testCue{background:#444;color:#fff;margin-top:14px;width:100%;border:0;border-radius:12px;padding:12px;font:inherit;font-weight:600}
#save{background:#0a84ff;color:#fff}
#cancel{background:#303030;color:#fff}
#hint{font-size:12px;color:#888;margin-top:12px;line-height:1.5}
@media (orientation:portrait){
  #app{justify-content:flex-start;padding-top:calc(env(safe-area-inset-top) + 20vh)}
  #time{font-size:min(22vw,19vh)}
  .controls{margin-top:22vh}
  .circle{width:138px;height:138px;font-size:29px}
}
@media (orientation:landscape){
  #app{justify-content:flex-start;padding-top:calc(env(safe-area-inset-top) + 12vh)}
  #time{font-size:min(22vw,34vh)}
  .controls{margin-top:9vh}
  .circle{width:118px;height:118px;font-size:25px}
  .card{max-height:88dvh}
}
</style>
</head>
<body>
<div id="app">
  <div id="time">00:00.00</div>
  <div class="controls">
    <button id="reset" class="circle" type="button">重置</button>
    <button id="stop" class="circle" type="button">停止</button>
  </div>
  <button id="gear" type="button" aria-label="設定">⚙︎</button>
</div>

<div id="panel" aria-hidden="true">
  <div class="card">
    <h2>Tea Stopwatch 設定</h2>

    <div class="row">
      <label for="soundOn">提示音</label>
      <input id="soundOn" type="checkbox">
    </div>

    <div class="row">
      <label for="interval">提示間隔（秒）</label>
      <input id="interval" type="number" min="1" max="3600" step="1" value="20">
    </div>

    <div class="row">
      <label for="beepCount">提示音次數</label>
      <select id="beepCount">
        <option value="1">1 聲</option>
        <option value="2" selected>2 聲</option>
        <option value="3">3 聲</option>
        <option value="4">4 聲</option>
        <option value="5">5 聲</option>
      </select>
    </div>

    <div class="row">
      <label for="volume">提示音音量</label>
      <div class="volWrap">
        <input id="volume" type="range" min="0" max="100" step="5" value="70">
        <span id="volumeValue">70%</span>
      </div>
    </div>

    <div class="row">
      <label for="flashOn">螢幕閃爍</label>
      <input id="flashOn" type="checkbox" checked>
    </div>

    <div class="row">
      <label for="flashCount">閃爍次數</label>
      <select id="flashCount">
        <option value="1">1 次</option>
        <option value="2" selected>2 次</option>
        <option value="3">3 次</option>
        <option value="4">4 次</option>
        <option value="5">5 次</option>
      </select>
    </div>

    <div class="row">
      <label for="awakeMinutes">螢幕保持亮起</label>
      <div class="volWrap">
        <input id="awakeMinutes" type="range" min="1" max="10" step="1" value="5">
        <span id="awakeValue">5 分</span>
      </div>
    </div>

    <button id="testCue" type="button">測試目前提示</button>

    <div class="actions">
      <button id="cancel" type="button">取消</button>
      <button id="save" type="button">儲存</button>
    </div>

    <div id="hint">
      前景：依設定發聲與閃爍。<br>
      切到其他 App 或鎖屏：計時繼續，但背景不發聲、不閃爍。<br>
      音量百分比只控制 Tea Stopwatch 自身音量，不會改變 iPhone 系統音量。<br>
      螢幕保持亮起時間從每次「開始 / 重置」重新計算；到期後交回 iPhone 原本的自動鎖定機制。
    </div>
  </div>
</div>

<script>
(() => {
  const app = document.getElementById('app');
  const timeEl = document.getElementById('time');
  const resetBtn = document.getElementById('reset');
  const stopBtn = document.getElementById('stop');
  const gearBtn = document.getElementById('gear');
  const panel = document.getElementById('panel');

  const soundOnEl = document.getElementById('soundOn');
  const intervalEl = document.getElementById('interval');
  const beepCountEl = document.getElementById('beepCount');
  const volumeEl = document.getElementById('volume');
  const volumeValueEl = document.getElementById('volumeValue');
  const flashOnEl = document.getElementById('flashOn');
  const flashCountEl = document.getElementById('flashCount');
  const awakeMinutesEl = document.getElementById('awakeMinutes');
  const awakeValueEl = document.getElementById('awakeValue');
  const testCueBtn = document.getElementById('testCue');
  const saveBtn = document.getElementById('save');
  const cancelBtn = document.getElementById('cancel');

  let running = true;
  let startedEpoch = Date.now();
  let accumulated = 0;

  let soundOn = localStorage.getItem('teaSoundOn') === '1';
  let intervalSec = Math.max(1, Number(localStorage.getItem('teaInterval') || '20'));
  let beepCount = Math.min(5, Math.max(1, Number(localStorage.getItem('teaBeepCount') || '2')));
  let volumePct = Math.min(100, Math.max(0, Number(localStorage.getItem('teaVolume') || '70')));
  let flashOn = localStorage.getItem('teaFlashOn') !== '0';
  let flashCount = Math.min(5, Math.max(1, Number(localStorage.getItem('teaFlashCount') || '2')));
  let awakeMinutes = Math.min(10, Math.max(1, Number(localStorage.getItem('teaAwakeMinutes') || '5')));

  let lastCueIndex = 0;
  let audioCtx = null;
  let wakeLock = null;
  let wakeTimer = null;

  async function releaseWakeLock() {
    if (wakeTimer) {
      clearTimeout(wakeTimer);
      wakeTimer = null;
    }
    if (wakeLock) {
      try { await wakeLock.release(); } catch (_) {}
      wakeLock = null;
    }
  }

  async function armWakeLock() {
    await releaseWakeLock();
    if (!running || document.visibilityState !== 'visible' || !('wakeLock' in navigator)) return;

    try {
      wakeLock = await navigator.wakeLock.request('screen');
      const ms = awakeMinutes * 60 * 1000;
      wakeTimer = setTimeout(() => {
        releaseWakeLock();
      }, ms);

      wakeLock.addEventListener('release', () => {
        wakeLock = null;
      });
    } catch (_) {}
  }

  function elapsedMs() {
    return running ? accumulated + (Date.now() - startedEpoch) : accumulated;
  }

  function formatTime(ms) {
    const t = Math.max(0, Math.floor(ms));
    const m = Math.floor(t / 60000);
    const s = Math.floor(t / 1000) % 60;
    const h = Math.floor((t % 1000) / 10);
    return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(h).padStart(2,'0')}`;
  }

  async function unlockAudio() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') await audioCtx.resume();
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      g.gain.value = 0.0001;
      o.connect(g);
      g.connect(audioCtx.destination);
      o.start();
      o.stop(audioCtx.currentTime + 0.01);
    } catch (_) {}
  }

  function playBeeps(count = beepCount, vol = volumePct) {
    if (!soundOn || document.visibilityState !== 'visible' || vol <= 0) return;

    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});

      const gainLevel = 0.24 * (vol / 100);

      for (let i = 0; i < count; i++) {
        const offset = i * 0.16;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'square';
        osc.frequency.value = 1800;
        gain.gain.setValueAtTime(Math.max(0.001, gainLevel), audioCtx.currentTime + offset);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + offset + 0.10);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(audioCtx.currentTime + offset);
        osc.stop(audioCtx.currentTime + offset + 0.11);
      }
    } catch (_) {}
  }

  function flashScreen(count = flashCount) {
    if (!flashOn || document.visibilityState !== 'visible') return;

    const onMs = 95;
    const gapMs = 105;
    const cycle = onMs + gapMs;

    for (let i = 0; i < count; i++) {
      setTimeout(() => app.classList.add('flash'), i * cycle);
      setTimeout(() => app.classList.remove('flash'), i * cycle + onMs);
    }

    setTimeout(() => app.classList.remove('flash'), count * cycle + 20);
  }

  function fireCue() {
    playBeeps();
    flashScreen();
  }

  function updateCue() {
    if (!running || document.visibilityState !== 'visible') return;

    const idx = Math.floor(elapsedMs() / (intervalSec * 1000));
    if (idx > 0 && idx > lastCueIndex) {
      lastCueIndex = idx;
      fireCue();
    }
  }

  function render() {
    timeEl.textContent = formatTime(elapsedMs());
    updateCue();
    requestAnimationFrame(render);
  }

  function setUI() {
    stopBtn.textContent = running ? '停止' : '開始';
    stopBtn.classList.toggle('start', !running);
  }

  async function resetAndRun() {
    await unlockAudio();
    accumulated = 0;
    startedEpoch = Date.now();
    running = true;
    lastCueIndex = 0;
    setUI();
    await armWakeLock();
  }

  async function toggleStop() {
    await unlockAudio();

    if (running) {
      accumulated = elapsedMs();
      running = false;
      await releaseWakeLock();
    } else {
      startedEpoch = Date.now();
      running = true;
      lastCueIndex = Math.floor(accumulated / (intervalSec * 1000));
      await armWakeLock();
    }

    setUI();
  }

  resetBtn.addEventListener('click', resetAndRun);
  stopBtn.addEventListener('click', toggleStop);

  gearBtn.addEventListener('click', async () => {
    await unlockAudio();

    soundOnEl.checked = soundOn;
    intervalEl.value = String(intervalSec);
    beepCountEl.value = String(beepCount);
    volumeEl.value = String(volumePct);
    volumeValueEl.textContent = `${volumePct}%`;
    flashOnEl.checked = flashOn;
    flashCountEl.value = String(flashCount);
    awakeMinutesEl.value = String(awakeMinutes);
    awakeValueEl.textContent = `${awakeMinutes} 分`;

    panel.classList.add('show');
    panel.setAttribute('aria-hidden','false');
  });

  volumeEl.addEventListener('input', () => {
    volumeValueEl.textContent = `${volumeEl.value}%`;
  });

  awakeMinutesEl.addEventListener('input', () => {
    awakeValueEl.textContent = `${awakeMinutesEl.value} 分`;
  });

  testCueBtn.addEventListener('click', async () => {
    await unlockAudio();

    const previewSoundOn = soundOnEl.checked;
    const previewBeepCount = Number(beepCountEl.value);
    const previewVolume = Number(volumeEl.value);
    const previewFlashOn = flashOnEl.checked;
    const previewFlashCount = Number(flashCountEl.value);

    const oldSoundOn = soundOn;
    const oldFlashOn = flashOn;

    soundOn = previewSoundOn;
    flashOn = previewFlashOn;

    playBeeps(previewBeepCount, previewVolume);
    flashScreen(previewFlashCount);

    soundOn = oldSoundOn;
    flashOn = oldFlashOn;
  });

  cancelBtn.addEventListener('click', () => {
    panel.classList.remove('show');
    panel.setAttribute('aria-hidden','true');
  });

  saveBtn.addEventListener('click', async () => {
    await unlockAudio();

    soundOn = soundOnEl.checked;

    const n = Math.floor(Number(intervalEl.value));
    intervalSec = Number.isFinite(n) ? Math.min(3600, Math.max(1, n)) : 20;

    beepCount = Math.min(5, Math.max(1, Number(beepCountEl.value)));
    volumePct = Math.min(100, Math.max(0, Number(volumeEl.value || '70')));
    flashOn = flashOnEl.checked;
    flashCount = Math.min(5, Math.max(1, Number(flashCountEl.value)));
    awakeMinutes = Math.min(10, Math.max(1, Number(awakeMinutesEl.value)));

    localStorage.setItem('teaSoundOn', soundOn ? '1' : '0');
    localStorage.setItem('teaInterval', String(intervalSec));
    localStorage.setItem('teaBeepCount', String(beepCount));
    localStorage.setItem('teaVolume', String(volumePct));
    localStorage.setItem('teaFlashOn', flashOn ? '1' : '0');
    localStorage.setItem('teaFlashCount', String(flashCount));
    localStorage.setItem('teaAwakeMinutes', String(awakeMinutes));

    lastCueIndex = Math.floor(elapsedMs() / (intervalSec * 1000));
    if (running) await armWakeLock();

    panel.classList.remove('show');
    panel.setAttribute('aria-hidden','true');
  });

  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState === 'visible') {
      // No catch-up cue after returning from background.
      lastCueIndex = Math.floor(elapsedMs() / (intervalSec * 1000));
      if (running) await armWakeLock();
    } else {
      await releaseWakeLock();
    }
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
  }

  setUI();
  render();
})();
</script>
</body>
</html>
